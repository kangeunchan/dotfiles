# ~/.config/tmux/tmux.conf
# Responsibility-specific fragments are loaded in declaration order.
source-file ~/.config/tmux/conf.d/terminal.conf
source-file ~/.config/tmux/conf.d/status.conf
source-file ~/.config/tmux/conf.d/windows.conf
source-file ~/.config/tmux/conf.d/panes.conf
source-file ~/.config/tmux/conf.d/interface.conf
source-file ~/.config/tmux/conf.d/keybindings.conf
source-file ~/.config/tmux/conf.d/persistence.conf
