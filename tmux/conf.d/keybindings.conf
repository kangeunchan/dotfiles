# Keyboard ownership: tmux uses C-a. Keep Control held for Korean-safe chords.
set -g prefix C-a
set -g prefix2 None
set -g repeat-time 650
set -sg escape-time 10
set -g mode-keys vi
set -g status-keys vi

# Replace the stock prefix table; root mouse bindings and copy-mode defaults remain.
unbind-key -a -T prefix

# Core commands and literal C-a passthrough.
bind-key -T prefix C-a send-prefix
bind-key -T prefix ? list-keys -N
bind-key -T prefix : command-prompt
bind-key -T prefix r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind-key -T prefix C-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind-key -T prefix d detach-client
bind-key -T prefix C-d detach-client
bind-key -T prefix [ copy-mode
bind-key -T prefix C-[ copy-mode
bind-key -T prefix ] paste-buffer
bind-key -T prefix C-] paste-buffer

# Fast pane navigation: C-a then hjkl/arrows. Shift+arrow resizes.
bind-key -r -T prefix h select-pane -L
bind-key -r -T prefix j select-pane -D
bind-key -r -T prefix k select-pane -U
bind-key -r -T prefix l select-pane -R
bind-key -r -T prefix C-h select-pane -L
bind-key -r -T prefix C-j select-pane -D
bind-key -r -T prefix C-k select-pane -U
bind-key -r -T prefix C-l select-pane -R
bind-key -r -T prefix Left select-pane -L
bind-key -r -T prefix Down select-pane -D
bind-key -r -T prefix Up select-pane -U
bind-key -r -T prefix Right select-pane -R
bind-key -r -T prefix S-Left resize-pane -L 3
bind-key -r -T prefix S-Down resize-pane -D 2
bind-key -r -T prefix S-Up resize-pane -U 2
bind-key -r -T prefix S-Right resize-pane -R 3

# Group entry points. Plain and Control forms support both input sources.
bind-key -T prefix w switch-client -T kb-window
bind-key -T prefix C-w switch-client -T kb-window
bind-key -T prefix p switch-client -T kb-pane
bind-key -T prefix C-p switch-client -T kb-pane
bind-key -T prefix s switch-client -T kb-session
bind-key -T prefix C-s switch-client -T kb-session

# Direct window selection is layout independent.
bind-key -T prefix 0 select-window -t :=0
bind-key -T prefix 1 select-window -t :=1
bind-key -T prefix 2 select-window -t :=2
bind-key -T prefix 3 select-window -t :=3
bind-key -T prefix 4 select-window -t :=4
bind-key -T prefix 5 select-window -t :=5
bind-key -T prefix 6 select-window -t :=6
bind-key -T prefix 7 select-window -t :=7
bind-key -T prefix 8 select-window -t :=8
bind-key -T prefix 9 select-window -t :=9

# Window group: C-a C-w, then keep Control held for the final key.
bind-key -T kb-window c new-window -c "#{pane_current_path}"
bind-key -T kb-window C-c new-window -c "#{pane_current_path}"
bind-key -r -T kb-window n next-window
bind-key -r -T kb-window C-n next-window
bind-key -r -T kb-window p previous-window
bind-key -r -T kb-window C-p previous-window
bind-key -T kb-window l last-window
bind-key -T kb-window C-l last-window
bind-key -T kb-window w choose-tree -Zw
bind-key -T kb-window C-w choose-tree -Zw
bind-key -T kb-window r command-prompt -I "#W" "rename-window '%%'"
bind-key -T kb-window C-r command-prompt -I "#W" "rename-window '%%'"
bind-key -T kb-window x confirm-before -p "kill window #W? (y/n)" kill-window
bind-key -T kb-window C-x confirm-before -p "kill window #W? (y/n)" kill-window
bind-key -T kb-window 0 select-window -t :=0
bind-key -T kb-window 1 select-window -t :=1
bind-key -T kb-window 2 select-window -t :=2
bind-key -T kb-window 3 select-window -t :=3
bind-key -T kb-window 4 select-window -t :=4
bind-key -T kb-window 5 select-window -t :=5
bind-key -T kb-window 6 select-window -t :=6
bind-key -T kb-window 7 select-window -t :=7
bind-key -T kb-window 8 select-window -t :=8
bind-key -T kb-window 9 select-window -t :=9
bind-key -T kb-window Any display-message "window group: c/n/p/l/w/r/x/0-9"

# Pane group: split, move, balance, synchronize, zoom, break, and close.
bind-key -T kb-pane v split-window -h -c "#{pane_current_path}"
bind-key -T kb-pane C-v split-window -h -c "#{pane_current_path}"
bind-key -T kb-pane s split-window -v -c "#{pane_current_path}"
bind-key -T kb-pane C-s split-window -v -c "#{pane_current_path}"
bind-key -T kb-pane e select-layout tiled
bind-key -T kb-pane C-e select-layout tiled
bind-key -T kb-pane y set-window-option synchronize-panes \; display-message "pane sync: #{?pane_synchronized,on,off}"
bind-key -T kb-pane C-y set-window-option synchronize-panes \; display-message "pane sync: #{?pane_synchronized,on,off}"
bind-key -r -T kb-pane h select-pane -L
bind-key -r -T kb-pane j select-pane -D
bind-key -r -T kb-pane k select-pane -U
bind-key -r -T kb-pane l select-pane -R
bind-key -r -T kb-pane C-h select-pane -L
bind-key -r -T kb-pane C-j select-pane -D
bind-key -r -T kb-pane C-k select-pane -U
bind-key -r -T kb-pane C-l select-pane -R
bind-key -T kb-pane o select-pane -t :.+
bind-key -T kb-pane C-o select-pane -t :.+
bind-key -T kb-pane z resize-pane -Z
bind-key -T kb-pane C-z resize-pane -Z
bind-key -T kb-pane b break-pane
bind-key -T kb-pane C-b break-pane
bind-key -T kb-pane x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind-key -T kb-pane C-x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind-key -T kb-pane Any display-message "pane group: v/s/e/y/hjkl/o/z/b/x"

# Session group.
bind-key -T kb-session c command-prompt -p "new session:" "new-session -s '%%'"
bind-key -T kb-session C-c command-prompt -p "new session:" "new-session -s '%%'"
bind-key -r -T kb-session n switch-client -n
bind-key -r -T kb-session C-n switch-client -n
bind-key -r -T kb-session p switch-client -p
bind-key -r -T kb-session C-p switch-client -p
bind-key -T kb-session l switch-client -l
bind-key -T kb-session C-l switch-client -l
bind-key -T kb-session s choose-tree -Zs
bind-key -T kb-session C-s choose-tree -Zs
bind-key -T kb-session r command-prompt -I "#S" "rename-session '%%'"
bind-key -T kb-session C-r command-prompt -I "#S" "rename-session '%%'"
bind-key -T kb-session d detach-client
bind-key -T kb-session C-d detach-client
bind-key -T kb-session x confirm-before -p "kill session #S? (y/n)" kill-session
bind-key -T kb-session C-x confirm-before -p "kill session #S? (y/n)" kill-session
bind-key -T kb-session Any display-message "session group: c/n/p/l/s/r/d/x"

# Vi-style copy mode with macOS clipboard integration.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
