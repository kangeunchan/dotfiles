# Persist tmux sessions across server and macOS restarts.
# Continuum must load after status.conf so its autosave hook remains in status-right.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Preserve the existing C-a C-s and C-a C-r bindings.
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Save every five minutes and restore when a new tmux server starts.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Ghostty is not supported by continuum-boot, so launchd starts the tmux server.
run-shell '~/.config/tmux/plugins/tpm/tpm'
